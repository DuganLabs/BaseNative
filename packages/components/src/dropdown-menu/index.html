<template>
  <menu :variant="variant()" :aria-label="label()">
    <template @for="item of items()">
      <template @if="item.separator">
        <li role="none"><hr></li>
      </template>
      <template @else>
        <li role="none">
          <template @if="item.href">
            <a role="menuitem" :href="item.href" :aria-disabled="isDisabled(item)" @click="activate(item)" @keydown="onKeydown($event)">{{ item.label }}</a>
          </template>
          <template @else>
            <button type="button" role="menuitem" :aria-disabled="isDisabled(item)" @click="activate(item)" @keydown="onKeydown($event)">{{ item.label }}</button>
          </template>
        </li>
      </template>
    </template>
  </menu>
</template>
