<template>
  <nav :variant="variant()" :aria-label="label()">
    <ol>
      <template @for="item of items()">
        <li :variant="item.only">
          <template @if="item.current">
            <a aria-current="page">{{ item.label }}</a>
          </template>
          <template @else>
            <template @if="item.step">
              <a :href="item.href" :aria-hidden="item.hidden"
                ><svg aria-hidden="true" viewBox="0 0 16 16">
                  <path
                    :d="item.step === 'previous' ? 'M10 4l-4 4 4 4' : 'M6 4l4 4-4 4'"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  /></svg
                >{{ item.label }}</a
              >
            </template>
            <template @else>
              <template @if="item.page">
                <a :href="item.href">{{ item.label }}</a>
              </template>
              <template @else>
                <a aria-hidden="true">{{ item.label }}</a>
              </template>
            </template>
          </template>
        </li>
      </template>
    </ol>
  </nav>
</template>
