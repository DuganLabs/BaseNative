<template>
  <section :variant="variant()" :aria-label="label()" @keydown="onKeydown($event)" @input="onInput($event)" @focusin="onFocus($event)">
    {{ raw(inputHtml()) }}
    <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
    <template @if="open()">
      <ul role="listbox" :id="listboxId()" :aria-label="label()">
        <template @for="option of visibleOptions()">
          <li role="option" :id="optionId(option)" :aria-selected="isActive(option)" @click="choose($event, option)">{{ option.label }}</li>
        </template>
      </ul>
    </template>
  </section>
</template>
