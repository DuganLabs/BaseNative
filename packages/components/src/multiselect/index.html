<template>
  <section :variant="variant()" :aria-label="label()" @keydown="onKeydown($event)" @input="onInput($event)" @focusin="onFocus($event)">
    <template @if="hasSelected()">
      <ul @click="onChipsClick($event)">
        <template @for="item of selected()">
          <li>{{ item.label }} {{ raw(item.dismissHtml) }}</li>
        </template>
      </ul>
    </template>
    {{ raw(inputHtml()) }}
    <template @if="open()">
      <ul role="listbox" aria-multiselectable="true" :id="listboxId()" :aria-label="label()">
        <template @for="option of visibleOptions()">
          <li role="option" :id="optionId(option)" :aria-selected="isSelected(option)" @click="toggle(option)">{{ option.label }}</li>
        </template>
      </ul>
    </template>
  </section>
</template>
