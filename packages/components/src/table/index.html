<template>
  <table :variant="variant()">
    <template @if="hasCaption()">
      <caption>{{ caption() }}</caption>
    </template>
    <thead>
      <tr>
        <template @for="column of columns()">
          <th scope="col">{{ column }}</th>
        </template>
      </tr>
    </thead>
    <tbody>
      <template @for="row of rows()">
        <tr>
          <template @for="cell of row">
            <template @if="cell.header">
              <template @if="cell.current">
                <th scope="row" :aria-current="cell.current"><template @if="cell.contentHtml">{{ raw(cell.contentHtml) }}</template><template @else><template @if="cell.small"><small>{{ cell.text }}</small></template><template @else>{{ cell.text }}</template></template></th>
              </template>
              <template @else>
                <th scope="row"><template @if="cell.contentHtml">{{ raw(cell.contentHtml) }}</template><template @else><template @if="cell.small"><small>{{ cell.text }}</small></template><template @else>{{ cell.text }}</template></template></th>
              </template>
            </template>
            <template @else>
              <template @if="cell.current">
                <td :aria-current="cell.current"><template @if="cell.contentHtml">{{ raw(cell.contentHtml) }}</template><template @else><template @if="cell.small"><small>{{ cell.text }}</small></template><template @else>{{ cell.text }}</template></template></td>
              </template>
              <template @else>
                <td><template @if="cell.contentHtml">{{ raw(cell.contentHtml) }}</template><template @else><template @if="cell.small"><small>{{ cell.text }}</small></template><template @else>{{ cell.text }}</template></template></td>
              </template>
            </template>
          </template>
        </tr>
      </template>
    </tbody>
  </table>
</template>
