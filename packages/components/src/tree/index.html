<template>
  <ul :variant="variant()" :role="role()">
    <template @for="item of items()">
      <template @if="item.childrenHtml">
        <li role="treeitem" :aria-expanded="expandedState(item)">
          <template @if="item.toggleHtml">
            {{ raw(item.toggleHtml) }}
          </template>
          <template @else>
            {{ item.label }}
          </template>
          <ul role="group">{{ raw(item.childrenHtml) }}</ul>
        </li>
      </template>
      <template @else>
        <li role="treeitem">{{ item.label }}</li>
      </template>
    </template>
  </ul>
</template>
