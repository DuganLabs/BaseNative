<template>
  <section :variant="variant()">
    <label :for="controlId()">{{ label() }}</label>
    {{ raw(controlHtml()) }}
    <template @if="hasError()">
      <small>{{ error() }}</small>
    </template>
    <template @if="showHint()">
      <small>{{ hint() }}</small>
    </template>
  </section>
</template>
