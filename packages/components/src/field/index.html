<template>
  <section :variant="variant()">
    <label :for="controlId()">{{ label() }}</label>
    {{ raw(controlHtml()) }}
    <template @if="hasError()">
      <output :id="errorId()" :for="controlId()">{{ error() }}</output>
    </template>
    <template @if="hasHint()">
      <small :id="hintId()" :hidden="hasError()">{{ hint() }}</small>
    </template>
  </section>
</template>
