<style data-bn-critical="shell">
  /* Shell-critical rules (the shell's tokens, app nav + grouped list),
     generated from the catalog's tokens.css and components.css by
     page.js — see shellCriticalCss there for why the shell's styles
     and the values they compute from ride the HTML instead of
     depending on the cached @import chain. */
  <!--APP_NAV_CSS-->
</style>
<style data-bn-critical>
  /* Critical layout — unlayered, plain selectors, no nesting.
     Wins over external @layer rules so first paint is correct
     even if a later stylesheet fails to parse modern features. */
  [data-bn-skip-link] {
    position: absolute;
    inset-inline-start: -9999px;
    inset-block-start: -9999px;
    z-index: 10000;
    padding: var(--space-sm, 0.5rem) var(--space-md, 1rem);
    background: var(--accent, #e8920a);
    color: var(--surface-0, #0c0b09);
    font-weight: var(--font-weight-semibold, 600);
    text-decoration: none;
    border-radius: 0 0 var(--radius-sm, 0.25rem) 0;
  }
  [data-bn-skip-link]:focus {
    inset-inline-start: 0;
    inset-block-start: 0;
  }
  [data-bn-visually-hidden] {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  body > [data-bn-site-footer] {
    border-block-start: var(--border-width, 1px) solid var(--border, #2c2822);
    padding: var(--space-lg, 1.5rem);
    text-align: center;
    display: grid;
    gap: var(--space-sm, 0.5rem);
  }
  body > [data-bn-site-footer] nav {
    display: flex;
    gap: var(--space-md, 1rem);
    justify-content: center;
    flex-wrap: wrap;
  }
  body > [data-bn-site-footer] nav a {
    font-family: var(--font-family);
    font-stretch: var(--font-mono, ultra-condensed);
    font-size: var(--font-size-xs, 0.75rem);
    color: var(--text-2, #857c6b);
    text-decoration: none;
  }
  body > [data-bn-site-footer] nav a:hover { color: var(--accent, #e8920a); }
  /* Showcase header visual hierarchy — override article > header { display:flex } */
  [data-bn-showcase-header] {
    display: block;
    background: none;
    border: none;
    padding: 0;
    margin: 0 0 var(--space-2xl, 3rem);
  }
  [data-bn-showcase-header] [data-bn-eyebrow] {
    display: block;
    margin: 0 0 var(--space-sm, 0.5rem);
  }
  [data-bn-showcase-header] > h2 { margin: 0 0 var(--space-md, 1rem); }
  [data-bn-showcase-header] [data-bn-lede] { margin: 0 0 var(--space-lg, 1.5rem); }
  [data-bn-showcase-header] [data-bn-showcase-actions] {
    display: flex;
    gap: var(--space-sm, 0.5rem);
    flex-wrap: wrap;
  }
  /* Empty state hidden until the filter toggles the flag on the results
     container ([data-bn-showcase-search]) — scoped to that container so an
     unscoped attribute selector can never also match :root itself and blank
     the whole page (root carries no other content, so display:none there
     would hide header, footer and everything). */
  [data-bn-showcase-search] [data-bn-showcase-empty] { display: none; }
  [data-bn-showcase-search][data-bn-showcase-empty] [data-bn-showcase-empty] { display: block; }
</style>
</head>
<body>
  <a href="#main-content" data-bn-skip-link>Skip to main content</a>
  <!--APP_NAV-->
  <main id="main-content">
    <div role="status" aria-live="polite" data-bn-visually-hidden></div>
    <!--CONTENT-->
  </main>
  <footer data-bn-site-footer>
    <p>BaseNative — The UI runtime for code you didn't write · CSP-safe, no build step</p>
    <nav aria-label="Resources">
      <a href="https://github.com/DuganLabs/basenative" rel="noopener">GitHub</a>
      <a href="/docs">Docs</a>
      <a href="/components">Components</a>
    </nav>
  </footer>
  <!--SCRIPTS-->
  <script type="module">
    // The app nav's only behaviour: the phone-class More sheet. The
    // postures themselves are one media query — nothing to wire there.
    // Loaded defensively: /basenative.js is a cacheable asset, and a
    // copy from before initAppNav existed must not take the page down
    // with a failed named import — the sheet just stays inert until
    // the cached bundle ages out.
    import('/basenative.js')
      .then((m) => {
        const appNav = document.querySelector('[data-bn="app-nav"]');
        if (appNav && typeof m.initAppNav === 'function') m.initAppNav(appNav);
      })
      .catch(() => {});
  </script>
</body>
</html>
