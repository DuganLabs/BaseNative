      /* The chrome components' own sheets (@basenative/components),
         inlined: Pages caches linked sheets for hours and revalidates

      <!--APP_NAV_CSS-->
    </style>
    <style data-bn-critical>
      @layer components {
        [data-bn-skip-link] {
          position: absolute;
          inset-inline-start: -9999px;
          inset-block-start: -9999px;
          z-index: 10000;
          padding: var(--space-sm, 0.5rem) var(--space-md, 1rem);
          background: var(--color-tint, #e8920a);
          color: var(--color-text-on-tint, #0c0b09);
          font-weight: var(--font-weight-semibold, 600);
          text-decoration: none;
          border-radius: 0 0 var(--radius-sm, 0.25rem) 0;
        }
        [data-bn-skip-link]:focus {
          inset-inline-start: 0;
          inset-block-start: 0;
        }
        [data-bn-visually-hidden] {
          position: absolute;
          inline-size: 1px;
          block-size: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
          border: 0;
        }
      }
    </style>
  </head>
