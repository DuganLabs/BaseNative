    <style data-bn-critical>
      @layer components {
        [data-bn-skip-link] {
          position: absolute;
          inset-inline-start: -9999px;
          inset-block-start: -9999px;
          z-index: 10000;
          padding: var(--space-sm, 0.5rem) var(--space-md, 1rem);
          background: var(--accent, #e8920a);
          color: var(--surface-0, #0c0b09);
          font-weight: var(--font-weight-semibold, 600);
          text-decoration: none;
          border-radius: 0 0 var(--radius-sm, 0.25rem) 0;
        }
        [data-bn-skip-link]:focus {
          inset-inline-start: 0;
          inset-block-start: 0;
        }
        [data-bn-visually-hidden] {
          position: absolute;
          inline-size: 1px;
          block-size: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
          border: 0;
        }
        [data-bn-showcase-header] {
          display: block;
          background: none;
          border: none;
          padding: 0;
          margin: 0 0 var(--space-2xl, 3rem);
        }
        [data-bn-showcase-header] [data-bn-eyebrow] {
          display: block;
          margin: 0 0 var(--space-sm, 0.5rem);
        }
        [data-bn-showcase-header] > h2 {
          margin: 0 0 var(--space-md, 1rem);
        }
        [data-bn-showcase-header] [data-bn-lede] {
          margin: 0 0 var(--space-lg, 1.5rem);
        }
        [data-bn-showcase-header] [data-bn-showcase-actions] {
          display: flex;
          gap: var(--space-sm, 0.5rem);
          flex-wrap: wrap;
        }
        [data-bn-showcase-search] [data-bn-showcase-empty] {
          display: none;
        }
        [data-bn-showcase-search][data-bn-showcase-empty] [data-bn-showcase-empty] {
          display: block;
        }
      }
    </style>
