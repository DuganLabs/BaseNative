<!--
  Counter demo — server renders the initial count, client hydrates with live signals.
  This demonstrates the SSR → hydration pipeline. Hydrated pages read signals
  by calling them ({{ count() }}); the server passes signals in the render
  context so the same template works on both sides.
-->
<section>
  <h1>Signal Counter</h1>
  <p>
    The count was server-rendered as <strong>{{ initialCount }}</strong>.
    After hydration, the buttons below update it reactively.
  </p>

  <div>
    <output>{{ count() }}</output>
    <button @click="decrement()">−</button>
    <button @click="increment()">+</button>
    <button @click="reset()">Reset</button>
  </div>

  <template @if="count() > 0">
    <p>Counting up. {{ count() }} click{{ count() === 1 ? '' : 's' }} so far.</p>
  </template>
  <template @else>
    <template @if="count() < 0">
      <p>Counting down. You're at {{ count() }}.</p>
    </template>
    <template @else>
      <p>Counter is at zero.</p>
    </template>
  </template>
</section>
