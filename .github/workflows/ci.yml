# MANUAL-ONLY. Every workflow in this org runs on workflow_dispatch and
# nothing else: no push, no pull_request, no schedule. The owner runs it
# from the Actions tab when he wants GitHub minutes spent; everything it
# does also runs on a developer machine via scripts/pipeline.sh (checks)
# and the deploy scripts, from the same Doppler config. (2026-09-14)
name: CI

on:
  workflow_dispatch:

env:
  # Dependabot guard (owner decision, 2026-10-19): a run triggered by
  # dependabot[bot] gets an empty token, so Nx executes fully local and
  # can never consume Nx Cloud credits. Dependabot version updates are
  # disabled entirely (no .github/dependabot.yml); this is belt-and-braces
  # so no bot actor can engage Nx Cloud even if a PR trigger is added later.
  NX_CLOUD_ACCESS_TOKEN: ${{ github.actor == 'dependabot[bot]' && '' || secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.node-version == 22
        run: pnpm exec nx run-many --target=lint

      - name: Test
        run: pnpm exec nx run-many --target=test

      - name: Integration tests
        if: matrix.node-version == 22
        run: node --test tests/integration/integration.test.js

      - name: Bundle size check
        if: matrix.node-version == 22
        run: node scripts/bundle-size.js

      - name: Package inventory up to date
        if: matrix.node-version == 22
        run: node scripts/package-inventory.js --check

      - name: LLM docs up to date
        if: matrix.node-version == 22
        run: node scripts/llms-txt.js --check

      - name: Publish gate
        if: matrix.node-version == 22
        run: node scripts/publish-check.mjs

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm exec nx bundle basenative-example-express

      - name: Run E2E tests
        run: pnpm exec playwright test tests/e2e/
