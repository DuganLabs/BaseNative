# This workflow also runs on pull_request so the axiom check, the platform
# token lint (via nx lint), and the Playwright gates in tests/e2e/ can block
# a merge. Other workflows in the org stay workflow_dispatch only. (2026-09-14
# manual-only policy; this file is the exception, same as a push deploy.)
name: CI

on:
  workflow_dispatch:
  pull_request:

env:
  # Comma-separated commit author emails (case-insensitive) that may use
  # Nx Cloud. Everyone else runs fully local. Resolved before any nx command.
  NX_CLOUD_ALLOWED_AUTHORS: warrendugan@gmail.com

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Nx Cloud author
        id: nx-cloud
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/nx-cloud-access.sh

      - name: Expose Nx Cloud token
        if: steps.nx-cloud.outputs.allowed == 'true'
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: |
          {
            printf '%s\n' 'NX_CLOUD_ACCESS_TOKEN<<NX_CLOUD_TOKEN_END'
            printf '%s\n' "$NX_CLOUD_ACCESS_TOKEN"
            printf '%s\n' 'NX_CLOUD_TOKEN_END'
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Nx Cloud allow list
        if: matrix.node-version == 22
        run: node --test scripts/nx-cloud-access.test.js

      - run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.node-version == 22
        run: pnpm exec nx run-many --target=lint

      - name: Test
        run: pnpm exec nx run-many --target=test

      - name: Integration tests
        if: matrix.node-version == 22
        run: node --test tests/integration/integration.test.js

      - name: Bundle size check
        if: matrix.node-version == 22
        run: node scripts/bundle-size.js

      - name: Package inventory up to date
        if: matrix.node-version == 22
        run: node scripts/package-inventory.js --check

      - name: LLM docs up to date
        if: matrix.node-version == 22
        run: node scripts/llms-txt.js --check

      - name: Axiom check
        if: matrix.node-version == 22
        run: node scripts/axiom-check.js

      - name: Publish gate
        if: matrix.node-version == 22
        run: node scripts/publish-check.mjs

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Nx Cloud author
        id: nx-cloud
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/nx-cloud-access.sh

      - name: Expose Nx Cloud token
        if: steps.nx-cloud.outputs.allowed == 'true'
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: |
          {
            printf '%s\n' 'NX_CLOUD_ACCESS_TOKEN<<NX_CLOUD_TOKEN_END'
            printf '%s\n' "$NX_CLOUD_ACCESS_TOKEN"
            printf '%s\n' 'NX_CLOUD_TOKEN_END'
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm exec nx bundle basenative-example-express

      - name: Run E2E tests
        run: pnpm exec playwright test tests/e2e/
