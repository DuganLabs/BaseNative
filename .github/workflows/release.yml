# Runs on every push to main (the standard changesets flow) and can still
# be dispatched by hand. Publishing is direct over npm trusted publishing
# (OIDC). One scoped exception: npm cannot OIDC-publish a package that has
# never existed on the registry — a trusted publisher can only be
# configured on a package page, and the first publish creates the page —
# so scripts/publish-release.mjs first-publishes registry-absent packages
# with a granular token (the NPM_BOOTSTRAP_TOKEN secret, no provenance)
# and hands everything else to the OIDC lane. The trust boundary is repo
# write access: only invited collaborators can land code on main, and only
# this workflow publishes. Contributor protection for this public repo
# lives in Settings (read-only default GITHUB_TOKEN, fork-workflow
# approvals), not in the trigger. Revised 2026-10-20, superseding the
# 2026-09-14 manual-only org rule for this repo.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing: npm exchanges this job's GitHub OIDC token for a
  # one-time publish credential, and npm attaches a provenance attestation
  # to every version published that way. The only token anywhere is the
  # bootstrap fallback described above: scoped to first publishes, used by
  # the publish script only, and never presented to the OIDC lane.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # npm's trusted publisher for every @basenative package names this repo,
    # this workflow file and the `prd` environment. The environment only admits
    # the main branch, so nothing but a main-branch release can publish.
    environment: prd
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # pnpm 10 hands the actual upload to the npm bundled with Node.
          # Trusted publishing needs npm >= 11.5.1; Node 22 bundles 10.9, Node 24
          # bundles 11.x. This matches npm's own trusted-publishing example: the
          # registry-url line writes an .npmrc for npmjs, and npm uses the OIDC
          # exchange before it would ever fall back to a token. None is set.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec nx run-many --target=lint

      - name: Test
        run: pnpm exec nx run-many --target=test

      - name: Publish gate
        # Packs every package and refuses leaked files, unreachable types,
        # workspace links and private dependencies before anything is published.
        run: node scripts/publish-check.mjs

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # The publish script owns the two lanes described at the top of
          # this file: registry-absent packages are bootstrapped with the
          # token below; everything else is published by `changeset
          # publish` over OIDC. The token travels as NPM_BOOTSTRAP_TOKEN —
          # never NODE_AUTH_TOKEN — so npm itself only ever sees it inside
          # the bootstrap lane's child processes.
          publish-script: node scripts/publish-release.mjs
          version-script: pnpm run version
        env:
          # Only for opening the Version Packages pull request. Publishing
          # authenticates through the OIDC token above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

      - name: Clean-install smoke test from npmjs.org
        # Installs the just-published core packages into an empty directory
        # outside the monorepo and renders a page, so a release that only
        # works through workspace links fails here, not in a consumer.
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/npm-smoke.mjs
