# MANUAL-ONLY. Every workflow in this org runs on workflow_dispatch and
# nothing else: no push, no pull_request, no schedule. The owner runs it
# from the Actions tab when he wants GitHub minutes spent; everything it
# does also runs on a developer machine via scripts/pipeline.sh (checks)
# and the deploy scripts, from the same Doppler config. (2026-09-14)
name: Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing: npm exchanges this job's GitHub OIDC token for a
  # one-time publish credential. No npm token exists anywhere — not here, not
  # in Doppler. npm also attaches a provenance attestation to every version.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # npm's trusted publisher for every @basenative package names this repo,
    # this workflow file and the `prd` environment. The environment only admits
    # the main branch, so nothing but a main-branch release can publish.
    environment: prd
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # pnpm 10 hands the actual upload to the npm bundled with Node.
          # Trusted publishing needs npm >= 11.5.1; Node 22 bundles 10.9, Node 24
          # bundles 11.x. This matches npm's own trusted-publishing example: the
          # registry-url line writes an .npmrc for npmjs, and npm uses the OIDC
          # exchange before it would ever fall back to a token. None is set.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec nx run-many --target=lint

      - name: Test
        run: pnpm exec nx run-many --target=test

      - name: Publish gate
        # Packs every package and refuses leaked files, unreachable types,
        # workspace links and private dependencies before anything is published.
        run: node scripts/publish-check.mjs

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm exec changeset publish
          version-script: pnpm run version
        env:
          # Only for opening the Version Packages pull request. Publishing
          # authenticates through the OIDC token above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
