# Runs on every push to main (the standard changesets flow) and can still
# be dispatched by hand. Publishing is over npm trusted publishing (OIDC).
# One scoped exception: OIDC cannot publish a package that has never
# existed, and it cannot publish one whose trusted publisher was never
# configured. scripts/publish-release.mjs stages those with the
# stage-only granular token in NPM_BOOTSTRAP_TOKEN (`npm stage publish`,
# no provenance). The token cannot `npm publish` — that returns EOTP or
# E_STAGE_REQUIRED — and bypass-2FA tokens are not used. A maintainer
# approves each stage with 2FA on npmjs.com, then adds a trusted publisher
# for that package (also interactive 2FA). The trust boundary is repo
# write access: only invited collaborators can land code on main, and only
# this workflow publishes. Contributor protection for this public repo
# lives in Settings (read-only default GITHUB_TOKEN, fork-workflow
# approvals), not in the trigger. Revised 2026-10-22, superseding the
# 2026-09-14 manual-only org rule for this repo.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # Comma-separated commit author emails (case-insensitive) that may use
  # Nx Cloud. github-actions[bot] Version Packages commits are not on it.
  NX_CLOUD_ALLOWED_AUTHORS: warrendugan@gmail.com

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing: npm exchanges this job's GitHub OIDC token for a
  # one-time publish credential, and npm attaches a provenance attestation
  # to every version published that way. The only token anywhere is the
  # stage-only fallback described above: it can `npm stage publish` and
  # cannot publish directly, it is used by the publish script only, and
  # it is never presented to the OIDC lane.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Install, lint, test, the publish gate, and a release finish well under
    # this. The platform default is six hours, which is what left a slow
    # publish sitting until someone cancelled it.
    timeout-minutes: 30
    # npm's trusted publisher for every @basenative package names this repo,
    # this workflow file and the `prd` environment. The environment only admits
    # the main branch, so nothing but a main-branch release can publish.
    environment: prd
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Nx Cloud author
        id: nx-cloud
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/nx-cloud-access.sh

      - name: Expose Nx Cloud token
        if: steps.nx-cloud.outputs.allowed == 'true'
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: |
          {
            printf '%s\n' 'NX_CLOUD_ACCESS_TOKEN<<NX_CLOUD_TOKEN_END'
            printf '%s\n' "$NX_CLOUD_ACCESS_TOKEN"
            printf '%s\n' 'NX_CLOUD_TOKEN_END'
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          # pnpm 10 hands the actual upload to the npm bundled with Node.
          # Trusted publishing needs npm >= 11.5.1; `npm stage publish` needs
          # npm >= 11.15. Node 22 bundles npm 10.9, Node 24 bundles npm 11.x
          # (24.22 bundles 11.19). This matches npm's own trusted-publishing
          # example: the registry-url line writes an .npmrc for npmjs, and npm
          # uses the OIDC exchange before it would ever fall back to a token.
          # None is set on the OIDC lane. The stage-only token is injected
          # only into the stage lane's child processes.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec nx run-many --target=lint

      - name: Test
        run: pnpm exec nx run-many --target=test

      - name: Publish gate
        # Packs every package and refuses leaked files, unreachable types,
        # workspace links and private dependencies before anything is published.
        run: node scripts/publish-check.mjs

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          # The publish script owns the two lanes described at the top of
          # this file: packages OIDC cannot publish are staged with the
          # stage-only token below (`npm stage publish` of a `pnpm pack`
          # tarball); everything else is published by `changeset publish`
          # over OIDC. The token travels as NPM_BOOTSTRAP_TOKEN — never
          # NODE_AUTH_TOKEN — so npm itself only ever sees it inside the
          # stage lane's child processes. It is not a direct-publish token.
          publish-script: node scripts/publish-release.mjs
          version-script: pnpm run version
        env:
          # Only for opening the Version Packages pull request. Publishing
          # authenticates through the OIDC token above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

      - name: Clean-install smoke test from npmjs.org
        # Installs the just-published core packages into an empty directory
        # outside the monorepo and renders a page, so a release that only
        # works through workspace links fails here, not in a consumer.
        # Versions the publish script only staged are skipped: they are
        # not on the registry until a maintainer approves them.
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/npm-smoke.mjs
