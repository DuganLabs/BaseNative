name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # GitHub Packages: open-source projects in DuganLabs publish here
          # for free; consumers auth with a fine-grained PAT or GITHUB_TOKEN.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@basenative'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec nx run-many --target=lint

      - name: Test
        run: pnpm exec nx run-many --target=test

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Changesets reads NODE_AUTH_TOKEN for the publish step. The @basenative
          # packages live under the basenative org, so this repo's GITHUB_TOKEN can
          # neither read nor write them — NPM_TOKEN is a PAT with packages:write there.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
