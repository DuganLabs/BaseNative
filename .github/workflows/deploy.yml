# MANUAL-ONLY. Every workflow in this org runs on workflow_dispatch and
# nothing else: no push, no pull_request, no schedule. The owner runs it
# from the Actions tab when he wants GitHub minutes spent; everything it
# does also runs on a developer machine via scripts/pipeline.sh (checks)
# and the deploy scripts, from the same Doppler config. (2026-09-14)
name: Deploy to Cloudflare Pages

# Thin caller: delegates the Pages deploy to DuganLabs' org-wide reusable
# workflow instead of hand-rolling wrangler-action + raw secrets here.
# Cloudflare credentials: Doppler is not set up for this repo yet, so
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are passed directly as the
# documented fallback (see DuganLabs/.github's DOPPLER.md) — cf-deploy.yml
# picks Doppler automatically the moment a DOPPLER_TOKEN secret exists here.
#
# TODO: once DuganLabs/.github PR (Doppler-or-direct fallback + cf-worker-deploy)
# merges and is tagged, switch the `uses:` ref below from the branch name to
# that tag (e.g. @v4).

on:
  workflow_dispatch:

env:
  # Comma-separated commit author emails (case-insensitive) that may use
  # Nx Cloud. Everyone else runs fully local.
  NX_CLOUD_ALLOWED_AUTHORS: warrendugan@gmail.com

jobs:
  nx-cloud:
    name: Nx Cloud access
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.nx-cloud.outputs.allowed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve Nx Cloud author
        id: nx-cloud
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/nx-cloud-access.sh

  deploy:
    # Declared explicitly because this repo's default GITHUB_TOKEN is read-only
    # (Settings > Actions > Workflow permissions). cf-deploy.yml's own job asks
    # for `deployments: write`, and a called workflow can never hold more than
    # its caller grants — so with the read-only default the run failed before
    # any job started, with only "This run likely failed because of a workflow
    # file issue" to show for it. Every push to main since this workflow moved
    # onto the reusable one startup-failed that way, which is why
    # basenative.com/compare has been a 404 while duganlabs.com links to it from
    # every page. DuganLabs' own deploy works because that repo's default is
    # `write`; matching these three to what cf-deploy.yml requests fixes it
    # without loosening the repo-wide default.
    needs: nx-cloud
    permissions:
      contents: read
      deployments: write
      packages: read
    uses: DuganLabs/.github/.github/workflows/cf-deploy.yml@main
    with:
      project-name: basenative
      # cf-deploy only forwards the token. nxCloudId still connects when that
      # token is empty, so a non-owner run builds with NX_NO_CLOUD=true.
      build-command: "${{ needs.nx-cloud.outputs.allowed == 'true' && 'build:pages' || 'build:pages:no-cloud' }}"
      build-output-dir: dist
      node-version: "22"
      package-manager: pnpm
      # This repo pins pnpm in each workflow rather than with a
      # `packageManager` field (ci.yml and release.yml both
      # pass `version: 10`). pnpm/action-setup needs one or the other and
      # errors on both, so the version is passed through here.
      pnpm-version: "10"
      environment: production
      environment-url: https://basenative-docs.pages.dev
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NX_CLOUD_ACCESS_TOKEN: ${{ needs.nx-cloud.outputs.allowed == 'true' && secrets.NX_CLOUD_ACCESS_TOKEN || '' }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Nx Cloud author
        id: nx-cloud
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/nx-cloud-access.sh

      - name: Expose Nx Cloud token
        if: steps.nx-cloud.outputs.allowed == 'true'
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: |
          {
            printf '%s\n' 'NX_CLOUD_ACCESS_TOKEN<<NX_CLOUD_TOKEN_END'
            printf '%s\n' "$NX_CLOUD_ACCESS_TOKEN"
            printf '%s\n' 'NX_CLOUD_TOKEN_END'
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx playwright install chromium --with-deps

      - run: pnpm build:pages

      - name: Accessibility audit (axe-core)
        run: pnpm audit:axe

      - name: UX audit (Laws of UX)
        run: pnpm audit:ux

      - name: Security audit (Mozilla Observatory)
        run: pnpm audit:observatory
        env:
          DEPLOY_URL: https://basenative-docs.pages.dev

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-reports
          path: reports/
